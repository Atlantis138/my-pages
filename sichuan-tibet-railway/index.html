<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>川藏铁路三维图志</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="在建川藏铁路（成都—雅安—林芝—拉萨）三维交互图志：线路与桥隧、沿线地形地貌、生态、聚落与地质图层。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* Layout: full-bleed 3D relief block; left survey-ledger panel, right layer rack, bottom longitudinal profile strip. */
:root{
  --sky-top:#a9c1d3; --sky-bot:#e9eef0;
  --paper:#f6f7f5; --panel:rgba(247,248,246,.90); --panel-solid:#f7f8f6;
  --ink:#1c2429; --ink-2:#47545d; --ink-3:#7b8890; --rule:rgba(28,36,41,.13); --rule-2:rgba(28,36,41,.07);
  --cinnabar:#c23a22; --cinnabar-soft:rgba(194,58,34,.12); --rail:#1c2429; --rail-alt:#ffffff;
  --water:#3a83b6; --gold:#b07d1d; --forest:#3f6d4f; --fault:#a3326f; --tunnel:#6b2417; --tunnel-line:#5a1a0e;
  --halo:rgba(247,248,246,.92); --chip:#e8ebe7; --focus:#1f6fb0;
  --wall-top:#8e7f6c; --wall-bot:#5d5144;
  --f-display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --t-xs:11px; --t-sm:12.5px; --t-md:14px; --t-lg:17px; --t-xl:22px; --t-hero:40px;
  --r:10px; --gap:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sky-top:#0b1219; --sky-bot:#26323c;
  --paper:#12181d; --panel:rgba(16,21,26,.88); --panel-solid:#141a20;
  --ink:#e6ebee; --ink-2:#aeb9c0; --ink-3:#7d8a93; --rule:rgba(230,235,238,.14); --rule-2:rgba(230,235,238,.07);
  --cinnabar:#ff6a4b; --cinnabar-soft:rgba(255,106,75,.16); --rail:#e6ebee; --rail-alt:#1a2128;
  --water:#62aee3; --gold:#e0ad4c; --forest:#7fbf8f; --fault:#e070ae; --tunnel:#ff9b7f; --tunnel-line:#2b0b05;
  --halo:rgba(16,21,26,.9); --chip:#222b33; --focus:#69b4ff;
  --wall-top:#5b5046; --wall-bot:#2c2620; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --sky-top:#0b1219; --sky-bot:#26323c;
  --paper:#12181d; --panel:rgba(16,21,26,.88); --panel-solid:#141a20;
  --ink:#e6ebee; --ink-2:#aeb9c0; --ink-3:#7d8a93; --rule:rgba(230,235,238,.14); --rule-2:rgba(230,235,238,.07);
  --cinnabar:#ff6a4b; --cinnabar-soft:rgba(255,106,75,.16); --rail:#e6ebee; --rail-alt:#1a2128;
  --water:#62aee3; --gold:#e0ad4c; --forest:#7fbf8f; --fault:#e070ae; --tunnel:#ff9b7f; --tunnel-line:#2b0b05;
  --halo:rgba(16,21,26,.9); --chip:#222b33; --focus:#69b4ff;
  --wall-top:#5b5046; --wall-bot:#2c2620; color-scheme:dark;
}
html,body{height:100%;}
body{background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:var(--t-md); overflow:hidden;}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
#app{position:relative; height:100%; width:100%; overflow:hidden;
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bot) 62%,var(--sky-bot) 100%);}
#gl{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; outline:none}
#labels{position:absolute; inset:0; pointer-events:none; overflow:hidden; contain:strict}

/* ---------- map labels ---------- */
.lb{position:absolute; left:0; top:0; pointer-events:auto; white-space:nowrap; will-change:transform; cursor:pointer;
  font-size:var(--t-sm); line-height:1.2; color:var(--ink); visibility:hidden;}
.lb .tx{position:absolute; left:8px; top:-9px; text-shadow:0 0 3px var(--halo),0 0 3px var(--halo),0 0 6px var(--halo);}
.lb .tx small{font-family:var(--f-num); font-size:12px; color:var(--ink-2); margin-left:3px; letter-spacing:.02em}
.lb .dot{position:absolute; left:-4px; top:-4px; width:8px; height:8px; border-radius:50%; background:var(--rail-alt); border:2px solid var(--rail)}
.lb.st-yl .dot{border-color:var(--cinnabar); width:10px; height:10px; left:-5px; top:-5px; border-width:2.5px}
.lb.st-yl .tx{font-weight:700; letter-spacing:.04em}
.lb.st-ll .tx,.lb.st-cy .tx{font-weight:500}
.lb.town .dot{width:6px; height:6px; left:-3px; top:-3px; border:1.5px solid var(--ink-2); background:var(--halo); border-radius:1px}
.lb.town.city .dot{width:8px;height:8px;left:-4px;top:-4px;border-width:2px;border-color:var(--ink)}
.lb.town .tx{color:var(--ink-2)}
.lb.town.city .tx{color:var(--ink); font-weight:500}
.lb.peak .ic,.lb.pass .ic{position:absolute; left:-6px; top:-9px; width:12px; height:10px}
.lb.peak .tx,.lb.pass .tx{left:9px; top:-10px; color:var(--ink-2); font-size:12px}
.lb.river{cursor:default}
.lb.river .tx{left:0; top:-8px; transform:translateX(-50%); color:var(--water); font-style:italic; font-weight:500; letter-spacing:.12em; font-size:12px}
.lb.region{cursor:default}
.lb.region .tx{left:0; top:-8px; transform:translateX(-50%); color:var(--ink-3); letter-spacing:.3em; font-size:12px}
.lb.region.prov .tx{font-size:15px; letter-spacing:.5em; color:var(--ink-2); font-family:var(--f-display); font-weight:600; opacity:.85}
.lb.eco .ic,.lb.haz .ic,.lb.br .ic,.lb.tn .ic{position:absolute; left:-7px; top:-7px; width:14px; height:14px}
.lb.eco .tx{color:var(--forest); font-weight:500}
.lb.haz .tx{color:var(--fault); font-weight:500}
.lb.br .tx{color:var(--gold); font-weight:700}
.lb.tn .tx{color:var(--tunnel); font-weight:500; font-size:12px}
.lb.lake .tx{left:0;top:-8px;transform:translateX(-50%);color:var(--water);letter-spacing:.15em;font-size:12px}
.lb.lake{cursor:default}
.lb.hi .tx{background:var(--cinnabar); color:#fff; padding:1px 5px; border-radius:3px; text-shadow:none}
.lb.dim{opacity:.35}

/* ---------- brand + panel ---------- */
#side{position:absolute; top:12px; left:max(16px, env(safe-area-inset-left, 0px)); bottom:182px; width:384px;
  display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--rule); border-radius:var(--r);
  backdrop-filter:blur(10px) saturate(1.1); -webkit-backdrop-filter:blur(10px) saturate(1.1); overflow:hidden; z-index:5;
  transition:transform .35s ease}
#brand{padding:16px 18px 12px; border-bottom:1px solid var(--rule)}
.eyebrow{font-size:var(--t-xs); letter-spacing:.18em; color:var(--ink-3); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.eyebrow .pill{color:var(--cinnabar); border:1px solid currentColor; padding:0 6px; border-radius:99px; letter-spacing:.1em}
h1{font-family:var(--f-display); font-weight:900; font-size:var(--t-hero); line-height:1.05; margin:6px 0 2px; letter-spacing:.06em; text-wrap:balance}
h1 .rail{display:inline-block; width:64px; height:7px; margin:0 0 9px 10px; vertical-align:middle;
  background:repeating-linear-gradient(90deg,var(--cinnabar) 0 12px,transparent 12px 16px); border-radius:2px}
.sub{color:var(--ink-2); font-size:var(--t-sm); letter-spacing:.06em}
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:12px}
.stat{min-width:0}
.stat b{display:block; font-family:var(--f-num); font-weight:600; font-size:24px; line-height:1; letter-spacing:.01em; font-variant-numeric:tabular-nums}
.stat b em{font-style:normal; font-size:13px; color:var(--ink-2); margin-left:1px}
.stat span{display:block; font-size:11px; color:var(--ink-3); margin-top:3px; letter-spacing:.04em}
#tabs{display:flex; gap:2px; padding:6px 10px 0; border-bottom:1px solid var(--rule); overflow-x:auto; scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{background:none; border:none; padding:8px 9px 9px; font-size:13.5px; color:var(--ink-2); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; letter-spacing:.06em}
#tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--cinnabar); font-weight:700}
#pane{flex:1; overflow-y:auto; padding:14px 18px 22px; overscroll-behavior:contain}
#pane h2{font-family:var(--f-display); font-weight:600; font-size:var(--t-lg); margin:18px 0 8px; letter-spacing:.04em; text-wrap:balance}
#pane h2:first-child{margin-top:2px}
#pane h3{font-size:var(--t-md); margin:14px 0 6px; font-weight:700}
#pane p{line-height:1.75; margin:6px 0; color:var(--ink); font-size:13.5px}
#pane .muted{color:var(--ink-3); font-size:12px; line-height:1.6}
.sec{border:1px solid var(--rule); border-radius:8px; padding:10px 12px; margin:8px 0; cursor:pointer; background:transparent; text-align:left; width:100%; display:block}
.sec:hover{border-color:var(--ink-3)}
.sec-h{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.sec-h strong{font-family:var(--f-display); font-size:16px; letter-spacing:.05em}
.sec-h .rt{font-size:12px; color:var(--ink-2)}
.chip{display:inline-block; font-size:11px; padding:1px 7px; border-radius:99px; background:var(--chip); color:var(--ink-2); letter-spacing:.04em; white-space:nowrap}
.chip.live{background:var(--cinnabar-soft); color:var(--cinnabar)}
.chip.ok{background:var(--chip); color:var(--ink)}
.sw{display:inline-block; width:22px; height:5px; border-radius:2px; vertical-align:middle; margin-right:6px}
.sw.yl{background:var(--cinnabar)}
.sw.op{background:repeating-linear-gradient(90deg,var(--rail) 0 6px,var(--rail-alt) 6px 12px); box-shadow:0 0 0 1px var(--rail)}
dl.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:8px 0 2px; font-size:12.5px}
dl.kv dt{color:var(--ink-3); white-space:nowrap}
dl.kv dd{margin:0; min-width:0; font-variant-numeric:tabular-nums}
.list{list-style:none; margin:4px 0; padding:0}
.list li{border-bottom:1px solid var(--rule-2)}
.list button{display:grid; grid-template-columns:30px 1fr auto; gap:8px; align-items:center; width:100%; padding:7px 2px; background:none; border:none; text-align:left; cursor:pointer; font-size:13px}
.list button:hover .nm{color:var(--cinnabar)}
.list .nm{font-weight:500}
.list .meta{font-size:11.5px; color:var(--ink-3); white-space:nowrap}
.list .ix{font-family:var(--f-num); color:var(--ink-3); font-size:13px; text-align:right}
.grp{font-size:11px; letter-spacing:.16em; color:var(--ink-3); margin:16px 0 4px; display:flex; align-items:center; gap:6px}
.bars{display:grid; gap:5px; margin:8px 0}
.bar{display:grid; grid-template-columns:96px 1fr 52px; align-items:center; gap:8px; font-size:12px}
.bar .tr{height:9px; background:var(--rule-2); border-radius:2px; overflow:hidden}
.bar .fl{height:100%; border-radius:2px}
.bar .v{font-family:var(--f-num); font-size:14px; text-align:right; font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto; margin:6px 0}
table{border-collapse:collapse; width:100%; font-size:12.5px}
th,td{padding:5px 6px; border-bottom:1px solid var(--rule-2); text-align:left; white-space:nowrap}
th{font-weight:500; color:var(--ink-3); font-size:11.5px}
td.num{font-family:var(--f-num); font-size:14px; text-align:right; font-variant-numeric:tabular-nums}
tr.mapped td:first-child{color:var(--cinnabar)}
.tl{list-style:none; padding:0; margin:6px 0 0; position:relative}
.tl:before{content:""; position:absolute; left:5px; top:6px; bottom:6px; width:1px; background:var(--rule)}
.tl li{position:relative; padding:0 0 14px 22px}
.tl li:before{content:""; position:absolute; left:0; top:5px; width:11px; height:11px; border-radius:50%; background:var(--paper); border:2px solid var(--ink-2)}
.tl li.yl:before{border-color:var(--cinnabar)}
.tl li.future:before{border-style:dashed}
.tl .d{font-family:var(--f-num); font-size:15px; letter-spacing:.03em; color:var(--ink-2)}
.tl .t{font-weight:700; font-size:13.5px; margin:1px 0}
.tl .x{font-size:12.5px; color:var(--ink-2); line-height:1.6}
.src{font-size:11px; color:var(--ink-3)}
.src a{color:inherit}
a{color:var(--focus)}
.vegbar{display:flex; height:16px; border-radius:3px; overflow:hidden; margin:8px 0 6px}
.vegbar span{height:100%}
.legend-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:3px 10px; font-size:11.5px}
.legend-grid i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px}

/* ---------- layer rack ---------- */
#rack{position:absolute; top:12px; right:max(16px, env(safe-area-inset-right, 0px)); width:248px; max-height:calc(100% - 196px);
  background:var(--panel); border:1px solid var(--rule); border-radius:var(--r); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  overflow-y:auto; z-index:5; font-size:13px}
#rack .hd{display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-bottom:1px solid var(--rule); position:sticky; top:0; background:var(--panel-solid); z-index:1}
#rack .hd strong{font-family:var(--f-display); letter-spacing:.08em}
#rack fieldset{border:none; margin:0; padding:8px 12px 10px; border-bottom:1px solid var(--rule-2)}
#rack legend{font-size:11px; letter-spacing:.16em; color:var(--ink-3); padding:0; margin-bottom:6px; float:left; width:100%}
#rack fieldset>*:nth-child(2){clear:both}
.seg{display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--rule); border-radius:7px; overflow:hidden}
.seg button{border:none; background:none; padding:6px 0; font-size:12px; cursor:pointer; color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--paper); font-weight:700}
.tg{display:flex; align-items:center; gap:8px; padding:4px 0; cursor:pointer; user-select:none}
.tg input{appearance:none; -webkit-appearance:none; width:28px; height:16px; border-radius:99px; background:var(--rule); position:relative; cursor:pointer; flex:none; margin:0; transition:background .2s}
.tg input:after{content:""; position:absolute; left:2px; top:2px; width:12px; height:12px; border-radius:50%; background:var(--panel-solid); transition:transform .2s; box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tg input:checked{background:var(--ink)}
.tg input:checked:after{transform:translateX(12px)}
.tg .k{width:18px; height:8px; flex:none; border-radius:2px}
.tg .lab{flex:1}
.rng{display:flex; align-items:center; gap:8px; margin-top:8px; font-size:12px; color:var(--ink-2)}
.rng label{white-space:nowrap}
.rng input{flex:1; min-width:0; accent-color:var(--cinnabar)}
.rng output{font-family:var(--f-num); font-size:15px; width:30px; text-align:right; color:var(--ink)}
select{background:var(--panel-solid); border:1px solid var(--rule); border-radius:6px; padding:2px 4px; font-size:12px}
#legend{padding:8px 12px 12px; font-size:11.5px; color:var(--ink-2)}
#legend .ramp{height:9px; border-radius:2px; margin:6px 0 2px}
#legend .rl{display:flex; justify-content:space-between; font-family:var(--f-num); font-size:12.5px; color:var(--ink-3)}

/* ---------- profile ---------- */
#prof{position:absolute; left:max(16px, env(safe-area-inset-left, 0px)); right:max(16px, env(safe-area-inset-right, 0px)); bottom:12px; height:158px;
  background:var(--panel); border:1px solid var(--rule); border-radius:var(--r); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); z-index:4; overflow:hidden}
#prof .ph{position:absolute; left:12px; top:7px; font-size:11px; letter-spacing:.14em; color:var(--ink-3); pointer-events:none; z-index:1}
#prof .ph b{color:var(--ink); letter-spacing:.06em; font-weight:700; margin-right:8px}
#prof svg{position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair}
#prof .tip{position:absolute; top:6px; right:12px; font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums; pointer-events:none}
#prof .tip b{font-family:var(--f-num); font-size:15px; color:var(--ink)}

/* ---------- hud ---------- */
#hud{position:absolute; right:max(272px, calc(env(safe-area-inset-right, 0px) + 260px)); bottom:182px; display:flex; flex-direction:column; align-items:flex-end; gap:8px; z-index:4; pointer-events:none}
#hud>*{pointer-events:auto}
.btns{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
.btn{display:inline-flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--rule); border-radius:8px; padding:7px 11px; cursor:pointer; font-size:12.5px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--cinnabar); border-color:var(--cinnabar); color:#fff; font-weight:700}
.btn svg{width:14px; height:14px}
#readout{background:var(--panel); border:1px solid var(--rule); border-radius:8px; padding:6px 10px; font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums; min-width:210px; text-align:right; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}
#readout b{font-family:var(--f-num); font-size:14.5px; color:var(--ink); font-weight:600}
#scale{display:flex; flex-direction:column; align-items:flex-end; font-family:var(--f-num); font-size:13px; color:var(--ink-2)}
#scale i{display:block; height:6px; border:1.5px solid var(--ink-2); border-top:none; margin-top:2px}
#compass{position:absolute; right:max(272px, calc(env(safe-area-inset-right, 0px) + 260px)); top:12px; width:44px; height:44px; border-radius:50%; background:var(--panel); border:1px solid var(--rule); cursor:pointer; z-index:4; display:grid; place-items:center; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}
#compass svg{width:30px; height:30px; transition:transform .05s linear}
#flyhud{position:absolute; left:50%; top:14px; transform:translateX(-50%); background:var(--panel); border:1px solid var(--rule); border-radius:99px; padding:6px 8px 6px 14px; display:flex; align-items:center; gap:10px; z-index:6; font-size:13px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}
#flyhud b{font-family:var(--f-display); letter-spacing:.06em}
#flyhud .km{font-family:var(--f-num); font-size:15px; color:var(--ink-2)}

/* ---------- search ---------- */
#search{position:absolute; top:12px; right:max(328px, calc(env(safe-area-inset-right, 0px) + 316px)); width:260px; z-index:6}
#app.rack-closed #search{right:max(72px, calc(env(safe-area-inset-right, 0px) + 60px))}
#q{width:100%; height:44px; border-radius:22px; border:1px solid var(--rule); background:var(--panel); padding:0 16px; font-size:13.5px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}
#q::placeholder{color:var(--ink-3)}
#qres{position:absolute; left:0; right:0; top:50px; background:var(--panel-solid); border:1px solid var(--rule); border-radius:10px; padding:4px 8px; box-shadow:0 10px 26px rgba(0,0,0,.16); max-height:360px; overflow-y:auto}
#qres button{grid-template-columns:auto 1fr auto}
#qres .none{padding:10px 4px; font-size:12.5px; color:var(--ink-3); border:none}
/* ---------- detail card ---------- */
#card{position:absolute; z-index:7; width:330px; max-width:calc(100% - 32px); max-height:min(70%, 560px); overflow-y:auto; background:var(--panel-solid); border:1px solid var(--rule);
  border-radius:var(--r); box-shadow:0 12px 32px rgba(0,0,0,.18); padding:14px 16px 16px; right:max(272px, calc(env(safe-area-inset-right, 0px) + 260px)); top:68px}
#card .x{position:absolute; right:8px; top:8px; border:none; background:none; cursor:pointer; width:28px; height:28px; border-radius:6px; color:var(--ink-2); font-size:18px; line-height:1}
#card .x:hover{background:var(--chip)}
#card .k{font-size:11px; letter-spacing:.16em; color:var(--ink-3)}
#card h4{font-family:var(--f-display); font-size:20px; margin:4px 30px 6px 0; letter-spacing:.04em; text-wrap:balance}

#card .chips{display:flex; gap:6px; flex-wrap:wrap}

#loader{position:absolute; inset:0; display:grid; place-items:center; z-index:20; pointer-events:none; transition:opacity .6s}

#err{position:absolute; inset:auto 16px 50% 16px; z-index:30; text-align:center; color:var(--ink); background:var(--panel-solid); border:1px solid var(--rule); border-radius:10px; padding:16px}

#app.rack-closed #hud,#app.rack-closed #compass,#app.rack-closed #card{right:max(16px, env(safe-area-inset-right, 0px))}

/* ---------- mobile ---------- */
#mtoggle,#mlayers{display:none}
#brand{position:relative}
#sideFold{position:absolute; right:14px; top:14px; padding:4px 10px; font-size:12px}

#side.collapsed #tabs,#side.collapsed #pane{display:none}
#side.collapsed #brand{border-bottom:none}

  #side.open{transform:none}
  #brand{padding:12px max(16px, env(safe-area-inset-left, 0px)) 8px max(16px, env(safe-area-inset-right, 0px)); position:relative}
  #brand .sub{display:none}
  .stats{margin-top:8px}
  .stat b{font-size:19px}
  #pane{padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}

  #rack.open{display:block}
  #mlayers{display:inline-flex}

    h = '<div>高程（m）</div><div class="ramp" style="background:linear-gradient(90deg,' + stops.join(',') + ')"></div><div class="rl"><span>0</span><span>2000</span><span>4000</span><span>6500</span></div>';
  } else if (m === 1) {
    h = '<div>植被类型（1:100万植被图）</div><div class="legend-grid" style="margin-top:6px">' + VEG.map(function (v) { return '<span><i style="background:rgb(' + v[1].join(',') + ')"></i>' + esc(v[0].replace('（裸岩、冰雪）', '')) + '</span>'; }).join('') + '</div>';
  } else if (m === 2) {
    h = '<div>地质年代（中国及邻区地质图）</div><div class="legend-grid" style="margin-top:6px">' + GEO.slice(1).map(function (v) { return '<span><i style="background:rgb(' + v[1].join(',') + ')"></i>' + esc(v[0]) + '</span>'; }).join('') + '</div>';
  } else h = '<div>素白晕渲：仅以光照表现起伏，便于阅读线路与标注。</div>';
  if (LAYER.fault) h += '<div style="margin-top:8px">活动断裂（最新活动时代）</div><div class="legend-grid" style="margin-top:4px"><span><i style="background:var(--fault)"></i>全新世</span><span><i style="background:var(--fault);opacity:.7"></i>晚更新世</span><span><i style="background:var(--fault);opacity:.45"></i>早中更新世</span><span><i style="background:var(--fault);opacity:.3"></i>其他/未知</span></div>';
  $('#legend').innerHTML = h;
}
function setMode(m) {
  TU.mode.value = m; $$('.seg button').forEach(function (b) { b.setAttribute('aria-pressed', +b.dataset.mode === m ? 'true' : 'false'); });
  legend(); needs = true;
}
$$('.seg button').forEach(function (b) { b.addEventListener('click', function () { setMode(+b.dataset.mode); }); });
var exagPending = false;
$('#exag').addEventListener('input', function () {
  EXAG = +this.value; TU.exag.value = EXAG; $('#exagV').textContent = EXAG + '×';
  if (!exagPending) { exagPending = true; requestAnimationFrame(function () { exagPending = false; drapes.forEach(function (d) { d.update(); }); needs = true; }); }
});
function bindToggle(id, fn) { var el = $('#' + id); el.addEventListener('change', function () { fn(el.checked); needs = true; }); fn(el.checked); }
function wireLayers() {
  bindToggle('L_contour', function (v) { TU.contourOn.value = v ? 1 : 0; });
  $('#contourStep').addEventListener('change', function () { TU.contourStep.value = +this.value; needs = true; });
  bindToggle('L_grat', function (v) { TU.gratOn.value = v ? 1 : 0; LAYER.grat = v; });
  bindToggle('L_route', function (v) { [L.opBase, L.opDash, L.ylHalo, L.ylCore].forEach(function (d) { d.show(v); }); });
  bindToggle('L_station', function (v) { LAYER.station = v; });

  bindToggle('L_tunnel', function (v) { LAYER.tunnel = v; L.tunnel.show(v); });
  bindToggle('L_branch', function (v) { L.branch.show(v); });
  bindToggle('L_river', function (v) { LAYER.river = v; L.river.forEach(function (d) { d.show(v); }); TU.waterAmt.value = v ? 1 : 0; });
  bindToggle('L_rname', function (v) { LAYER.rname = v; });
  bindToggle('L_peak', function (v) { LAYER.peak = v; });
  bindToggle('L_town', function (v) { LAYER.town = v; });
  bindToggle('L_admin', function (v) { L.prov.show(v); L.pref.show(v); });
  bindToggle('L_county', function (v) { L.county.show(v); });
  bindToggle('L_region', function (v) { LAYER.region = v; });
  bindToggle('L_eco', function (v) { LAYER.eco = v; });
  bindToggle('L_fault', function (v) { LAYER.fault = v; L.fault.forEach(function (d) { d.show(v); }); legend(); });
  bindToggle('L_hazard', function (v) { LAYER.hazard = v; });
}

/* ------------------------------------------------------------------ profile */
var psvg = $('#psvg'), ptip = $('#ptip'), PROF = null;
function buildProfile() {
  var box = $('#prof'); var W = box.clientWidth, H = box.clientHeight; if (!W || !H) return;
  var mL = 46, mR = 14, mT = 30, mB = 40, pw = W - mL - mR, ph = H - mT - mB, maxE = 6000;
  var xs = function (K) { return mL + K / TOTAL * pw; }, ys = function (e) { return mT + ph - e / maxE * ph; };
  var pts = [], step = Math.max(1, Math.round(TOTAL / pw / 1.2));
  for (var i = 0; i < FULL.length; i += step) { var f = FULL[i]; pts.push([xs(f.K), ys(clamp(hBic(f.lon, f.lat), 0, maxE))]); }
  var last = FULL[FULL.length - 1]; pts.push([xs(last.K), ys(hBic(last.lon, last.lat))]);
  var line = pts.map(function (p, k) { return (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join('');
  var area = line + 'L' + xs(TOTAL).toFixed(1) + ' ' + (mT + ph) + 'L' + mL + ' ' + (mT + ph) + 'Z';
  var s = '<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ink-2)" stop-opacity=".38"/><stop offset="1" stop-color="var(--ink-2)" stop-opacity=".05"/></linearGradient></defs>';
  // yl band
  s += '<rect x="' + xs(SEC_OFF.yl) + '" y="' + mT + '" width="' + (xs(SEC_OFF.ll) - xs(SEC_OFF.yl)) + '" height="' + ph + '" fill="var(--cinnabar)" fill-opacity=".05"/>';
  // grid
  for (var e = 1000; e <= 5000; e += 1000) s += '<line x1="' + mL + '" x2="' + (W - mR) + '" y1="' + ys(e) + '" y2="' + ys(e) + '" stroke="var(--rule)" stroke-dasharray="2 4"/><text x="' + (mL - 6) + '" y="' + (ys(e) + 4) + '" text-anchor="end" font-size="11.5" fill="var(--ink-3)" font-family="var(--f-num)">' + e + '</text>';
  s += '<text x="' + (mL - 6) + '" y="' + (mT + ph + 4) + '" text-anchor="end" font-size="11.5" fill="var(--ink-3)" font-family="var(--f-num)">0 m</text>';
  s += '<path d="' + area + '" fill="url(#pg)"/><path d="' + line + '" fill="none" stroke="var(--ink-2)" stroke-width="1.3"/>';
  // section separators + names
  [['cy', '成雅段'], ['yl', '雅林段 · 在建'], ['ll', '拉林段']].forEach(function (a) {
    var k0 = SEC_OFF[a[0]], k1 = a[0] === 'cy' ? SEC_OFF.yl : a[0] === 'yl' ? SEC_OFF.ll : TOTAL;
    if (a[0] !== 'cy') s += '<line x1="' + xs(k0) + '" x2="' + xs(k0) + '" y1="' + (mT - 4) + '" y2="' + (mT + ph) + '" stroke="var(--ink-3)" stroke-width="1"/>';
    if (xs(k1) - xs(k0) > 60) s += '<text x="' + ((xs(k0) + xs(k1)) / 2) + '" y="' + (mT + 10) + '" text-anchor="middle" font-size="11.5" letter-spacing="2" fill="' + (a[0] === 'yl' ? 'var(--cinnabar)' : 'var(--ink-3)') + '">' + a[1] + '</text>';
  });
  // tunnels & bridges
  D.tunnels.forEach(function (t) { s += '<rect x="' + xs(t.K0) + '" y="' + (mT + ph + 2) + '" width="' + Math.max(1.5, xs(t.K1) - xs(t.K0)) + '" height="4" fill="var(--tunnel)"><title>' + esc(t.n) + ' ' + t.len.toFixed(1) + ' km</title></rect>'; });
  D.bridges.forEach(function (b) { var x = xs(b.K); s += '<path d="M' + (x - 3.5) + ' ' + (mT + ph + 4) + ' L' + x + ' ' + (mT + ph) + ' L' + (x + 3.5) + ' ' + (mT + ph + 4) + ' Z" fill="var(--gold)"><title>' + esc(b.n) + '</title></path>'; });
  // stations
  var placed = [];
  var st = D.stations.slice().sort(function (a, b) { return (b.s === 'yl') - (a.s === 'yl') || a.K - b.K; });
  st.forEach(function (sn) {
    var x = xs(sn.K), y = ys(clamp(hBic(sn.lon, sn.lat), 0, maxE)), w = sn.n.length * 12 + 4;
    s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (sn.s === 'yl' ? 2.6 : 2.1) + '" fill="var(--paper)" stroke="' + (sn.s === 'yl' ? 'var(--cinnabar)' : 'var(--ink)') + '" stroke-width="1.4"/>';
    for (var row = 0; row < 2; row++) {
      var x0 = x - w / 2, x1 = x + w / 2, ok = x0 > mL - 30 && x1 < W - 2;
      for (var q = 0; q < placed.length && ok; q++) if (placed[q][2] === row && x0 < placed[q][1] && x1 > placed[q][0]) ok = false;
      if (ok) {
        placed.push([x0, x1, row]);
        var ty = mT + ph + 18 + row * 13;
        s += '<line x1="' + x + '" x2="' + x + '" y1="' + (mT + ph + 7) + '" y2="' + (ty - 10) + '" stroke="var(--rule)"/><text x="' + x + '" y="' + ty + '" text-anchor="middle" font-size="11.5" fill="' + (sn.s === 'yl' ? 'var(--ink)' : 'var(--ink-2)') + '">' + esc(sn.n) + '</text>';
        break;
      }
    }
  });
  s += '<line id="pcur" x1="0" x2="0" y1="' + mT + '" y2="' + (mT + ph) + '" stroke="var(--cinnabar)" stroke-width="1.2" visibility="hidden"/>';
  s += '<rect id="phit" x="' + mL + '" y="0" width="' + pw + '" height="' + H + '" fill="transparent"/>';
  psvg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); psvg.innerHTML = s;
  PROF = { xs: xs, mL: mL, pw: pw };
}
function profCursor(K) {
  if (!PROF) return; var c = $('#pcur'); if (!c) return;
  if (K == null) { c.setAttribute('visibility', 'hidden'); ptip.textContent = ''; LAYER.cursor = false; needs = true; return; }
  var x = PROF.xs(K); c.setAttribute('x1', x); c.setAttribute('x2', x); c.setAttribute('visibility', 'visible');
  var p = fullAt(K), e = hBic(p.lon, p.lat), ns = nearestStation(K);
  var sec = { cy: '成雅段', yl: '雅林段', ll: '拉林段' }[p.s];
  ptip.innerHTML = esc(sec) + '　<b>' + nf(K) + '</b> km　地表 <b>' + nf(Math.round(e / 10) * 10) + '</b> m　近 ' + esc(ns.n);
  CURSOR.x = X(p.lon); CURSOR.z = Z(p.lat); CURSOR.h = hXZ(CURSOR.x, CURSOR.z); CURSOR.el.querySelector('.tx').textContent = sec + ' ' + nf(K) + ' km';
  CURSOR.w = CURSOR.el.querySelector('.tx').offsetWidth || 90; LAYER.cursor = true; needs = true;
}
psvg.addEventListener('pointermove', function (e) {
  if (!PROF || fly) return; var r = psvg.getBoundingClientRect(); var K = (e.clientX - r.left - PROF.mL) / PROF.pw * TOTAL;
  if (K < 0 || K > TOTAL) { profCursor(null); return; } profCursor(K);
});
psvg.addEventListener('pointerleave', function () { if (!fly) profCursor(null); });
psvg.addEventListener('click', function (e) {
  if (!PROF) return; var r = psvg.getBoundingClientRect(); var K = clamp((e.clientX - r.left - PROF.mL) / PROF.pw * TOTAL, 0, TOTAL);
  var p = fullAt(K); flyTo(p.lon, p.lat, 220, 0.95);
});

/* ------------------------------------------------------------------ pointer readout */
var ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), readPending = null;
function pick(cx, cy) {
  var r = canvas.getBoundingClientRect();
  mouse.set((cx - r.left) / r.width * 2 - 1, -(cy - r.top) / r.height * 2 + 1);
  ray.setFromCamera(mouse, camera);
  var o = ray.ray.origin, d = ray.ray.direction, t = 0, step = 2, prev = null;
  for (var k = 0; k < 2500; k++) {
    var x = o.x + d.x * t, y = o.y + d.y * t, z = o.z + d.z * t, gy = hXZ(x, z) * 0.001 * EXAG;
    if (y <= gy) {
      if (prev) { var lo = prev, hi = t; for (var b = 0; b < 18; b++) { var m = (lo + hi) / 2; var yy = o.y + d.y * m; if (yy <= hXZ(o.x + d.x * m, o.z + d.z * m) * 0.001 * EXAG) hi = m; else lo = m; } t = hi; }
      x = o.x + d.x * t; z = o.z + d.z * t;
      if (x < X(BOX[0]) || x > X(BOX[2]) || z < Z(BOX[3]) || z > Z(BOX[1])) return null;
      return { lon: LON(x), lat: LAT(z), h: hXZ(x, z) };
    }
    prev = t; step = Math.max(1, t * 0.004); t += step;
    if (t > 9000) break;
  }
  return null;
}
canvas.addEventListener('pointermove', function (e) {
  if (e.pointerType !== 'mouse') return;
  readPending = [e.clientX, e.clientY];
});
canvas.addEventListener('pointerleave', function () { $('#readout').textContent = '移动光标，查看经纬度与高程'; });
function doReadout() {
  if (!readPending) return; var p = pick(readPending[0], readPending[1]); readPending = null;
  $('#readout').innerHTML = p ? ('<b>' + p.lat.toFixed(3) + '</b>°N　<b>' + p.lon.toFixed(3) + '</b>°E　高程约 <b>' + nf(Math.round(p.h / 10) * 10) + '</b> m') : '移动光标，查看经纬度与高程';
}

/* ------------------------------------------------------------------ hud: compass + scale */
var compassSvg = $('#compass svg');
function hudUpdate() {
  var s = sph();
  compassSvg.style.transform = 'rotate(' + (s.az * 180 / Math.PI).toFixed(1) + 'deg)';
  var Hpx = canvas.clientHeight || 1, kmpp = 2 * s.r * Math.tan(camera.fov * Math.PI / 360) / Hpx;
  var nice = [5, 10, 20, 25, 50, 100, 200, 250, 500, 1000], pick2 = nice[0];
  for (var i = 0; i < nice.length; i++) if (nice[i] / kmpp <= 110) pick2 = nice[i];
  var sc = $('#scale'); sc.firstChild.textContent = pick2 + ' km'; sc.lastChild.style.width = (pick2 / kmpp).toFixed(0) + 'px';
  updateDashScale(s.r);
  var near = Math.max(400, s.r * 1.3); TU.fogNear.value = near; TU.fogFar.value = near + Math.max(1800, s.r * 2.6);
}
$('#compass').addEventListener('click', function () { var s = sph(); flyTo(LON(controls.target.x), LAT(controls.target.z), s.r, s.polar, 0, 900); });
$('#bReset').addEventListener('click', function () { closeCard(); overview(false); });
var tilted = false;
$('#bTilt').addEventListener('click', function () {
  var s = sph(); tilted = !tilted; this.textContent = tilted ? '斜视' : '俯视';
  flyTo(LON(controls.target.x), LAT(controls.target.z), s.r, tilted ? 0.04 : 0.9, s.az, 900);
});
$('#bFly').addEventListener('click', function () { if (fly) stopFly(); else startFly(); });
$('#flyStop').addEventListener('click', stopFly);
$('#flySpeed').addEventListener('click', function () { flySpeedIx = (flySpeedIx + 1) % 3; this.textContent = ['1×', '2×', '4×'][flySpeedIx]; });
canvas.addEventListener('pointerdown', function () { if (fly) stopFly(); tween = null; });
canvas.addEventListener('wheel', function () { if (fly) stopFly(); tween = null; }, { passive: true });
$('#rackClose').addEventListener('click', function () { $('#rack').classList.remove('open'); if (!isMobile()) { $('#rack').hidden = true; $('#app').classList.add('rack-closed'); applyViewOffset(); } });
$('#mlayers').addEventListener('click', function () { var r = $('#rack'); r.hidden = false; r.classList.toggle('open'); if (!isMobile()) { $('#app').classList.remove('rack-closed'); applyViewOffset(); } });
$('#bProfile').addEventListener('click', function () { var p = $('#prof'); if (isMobile()) { p.classList.toggle('open'); } else { p.hidden = !p.hidden; $('#side').style.bottom = p.hidden ? '16px' : ''; $('#hud').style.bottom = p.hidden ? '16px' : ''; } requestAnimationFrame(function () { buildProfile(); applyViewOffset(); }); });
$('#mtoggle').addEventListener('click', function () { var s = $('#side'); var o = s.classList.toggle('open'); this.setAttribute('aria-expanded', o ? 'true' : 'false'); this.textContent = o ? '收起资料' : '展开资料'; });
$('#side').addEventListener('transitionend', function () { if (isMobile()) applyViewOffset(); });
$('#sideFold').addEventListener('click', function () {
  var sd = $('#side'), c = sd.classList.toggle('collapsed');
  this.textContent = c ? '展开' : '收起'; this.setAttribute('aria-expanded', c ? 'false' : 'true'); applyViewOffset();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeCard(); stopFly(); } });

/* ------------------------------------------------------------------ theme application */
function applyTheme() {
  readTheme();
  TU.fogCol.value.set(TH['sky-bot'] || '#e9eef0');
  TU.amb.value = TH.dark ? 0.36 : 0.45; TU.dif.value = TH.dark ? 0.6 : 0.72;
  TU.plainCol.value.set(TH.dark ? '#b9b6ad' : '#ecebe6');
  TU.contourCol.value.set(TH.dark ? '#3b2a1c' : '#6b4f36');
  TU.waterCol.value.copy(col('water').lerp(new THREE.Color('#ffffff'), 0.25));
  if (walls) { walls.material.uniforms.top.value.copy(col('wall-top')); walls.material.uniforms.bot.value.copy(col('wall-bot')); }
  refreshDrapeColors(); if (PROF) buildProfile(); needs = true;
}
if (window.matchMedia) { var mq = matchMedia('(prefers-color-scheme: dark)'); (mq.addEventListener ? mq.addEventListener('change', applyTheme) : mq.addListener(applyTheme)); }
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class'] });

/* ------------------------------------------------------------------ resize + loop */
var needs = true;
function resize() {
  var w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix(); applyViewOffset();
  RES.set(w * renderer.getPixelRatio(), h * renderer.getPixelRatio());
  drapes.forEach(function (d) { d.mat.resolution.copy(RES); });
  buildProfile(); needs = true;
}
window.addEventListener('resize', resize);
controls.addEventListener('change', function () {
  var t = controls.target; var x0 = X(BOX[0]), x1 = X(BOX[2]), z0 = Z(BOX[3]), z1 = Z(BOX[1]);
  var cx = clamp(t.x, x0, x1), cz = clamp(t.z, z0, z1);
  if (cx !== t.x || cz !== t.z) { var dx = cx - t.x, dz = cz - t.z; t.x = cx; t.z = cz; camera.position.x += dx; camera.position.z += dz; }
  needs = true;
});
var lastLabel = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (fly) stepFly(now);
  else if (tween) stepTween(now);
  var moved = controls.enabled ? controls.update() : false;
  if (fly || tween) moved = true;
  if (moved || needs) {
    hudUpdate();
    renderer.render(scene, camera);
    updateLabels();
    needs = false;
  }
  doReadout();
}

/* ------------------------------------------------------------------ boot */
Promise.all([loadGray(VEG_B64), loadGray(GEO_B64)]).then(function (r) {
  TU.vegTex.value = classTex(r[0], VEG.map(function (v, i) { return v; }));
  TU.geoTex.value = classTex(r[1], GEO);
  buildTerrain(); buildOverlays(); buildLabels(); wireLayers(); applyTheme(); legend(); buildSearch();
  var t0 = 'overview'; try { t0 = localStorage.getItem('cz-tab') || 'overview'; } catch (e) { }
  setTab(TABS[t0] ? t0 : 'overview');
  if (isMobile()) { $('#rack').hidden = false; } else if (window.innerWidth < 1680) { $('#rack').hidden = true; $('#app').classList.add('rack-closed'); }
  resize(); overview(true);
  requestAnimationFrame(loop);
  setTimeout(function () { $('#loader').classList.add('done'); }, 120);
  window.__czReady = true;
  window.__cz = { openItem: openItem, flyTo: flyTo, setMode: setMode, setTab: setTab };
}).catch(function (err) {
  var e2 = document.createElement('div'); e2.id = 'err'; e2.textContent = '地形数据载入失败：' + (err && err.message || err);
  document.getElementById('app').appendChild(e2);
});
})();
