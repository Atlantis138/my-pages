<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>微观之旅</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="从一滴水缩放到普朗克尺度：电子云、核子密度、胶子场与量子真空的三维可视化。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 显微镜目镜式 HUD——全屏三维视场，左缘是 37 个数量级的对数标尺，右下是读数，左下是讲解卡片 */
:root{
  --bg:#03050a;
  --ink:#e6ebf0;
  --ink-2:#9ba7b5;
  --ink-3:#66717f;
  --line:rgba(190,210,235,.16);
  --glass:rgba(6,10,16,.66);
  --lamp:#f2c27c;      /* 显微镜灯丝的暖光：当前位置、强调 */
  --beam:#8ecfff;      /* 冷光：交互与链接 */
  --spec:#c69cff;      /* 推测性内容 */
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font:14px/1.7 var(--f-body);-webkit-font-smoothing:antialiased;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas#gl.drag{cursor:grabbing}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--beam);outline-offset:2px}

.hud{position:fixed;inset:0;pointer-events:none;
  padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(14px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud > *{pointer-events:auto}

/* 标题 */
.brand{position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;pointer-events:none}
.brand h1{margin:0;font:900 26px/1.1 var(--f-display);letter-spacing:.14em}
.brand p{margin:0;font:400 11px/1.4 var(--f-mono);letter-spacing:.18em;color:var(--ink-2);text-transform:uppercase}

/* 顶部按钮 */
.tools{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.btn{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .2s,color .2s}
.btn:hover{border-color:var(--beam);color:#fff}
.btn[aria-pressed="true"]{border-color:var(--lamp);color:var(--lamp)}

/* 对数标尺 */
.ruler{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:96px;bottom:150px;width:160px}
.ruler .track{position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--line)}
.ruler .tick{position:absolute;left:0;height:1px;background:var(--ink-3);width:5px}
.ruler .tick.major{width:10px;background:var(--ink-2)}
.ruler .tick span{position:absolute;left:14px;top:-7px;font:10px/1 var(--f-mono);color:var(--ink-3);white-space:nowrap}
.ruler .stop{position:absolute;left:58px;transform:translateY(-50%);font:500 12px/1.2 var(--f-body);color:var(--ink-2);background:none;border:0;padding:3px 6px;cursor:pointer;white-space:nowrap;text-align:left;border-radius:4px}
.ruler .stop:hover{color:#fff;background:rgba(255,255,255,.06)}
.ruler .stop.on{color:var(--lamp)}
.ruler .stop.spec{color:#a99bc4}
.ruler .stop.spec.on{color:var(--spec)}
.ruler .range{position:absolute;left:-1px;width:3px;background:rgba(142,207,255,.28);border-radius:2px}
.ruler .marker{position:absolute;left:-6px;width:13px;height:13px;margin-top:-6.5px;border:1.5px solid var(--lamp);border-radius:50%;box-shadow:0 0 12px rgba(242,194,124,.6);transition:none}
.ruler .marker::after{content:"";position:absolute;left:13px;top:5px;width:40px;height:1px;background:linear-gradient(90deg,var(--lamp),transparent)}
.ruler .desert{position:absolute;left:66px;font:11px/1.5 var(--f-body);color:var(--ink-3);writing-mode:vertical-rl;letter-spacing:.3em}

/* 读数 */
.readout{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));text-align:right;display:flex;flex-direction:column;gap:2px;pointer-events:none}
.readout .lab{font:10px/1.2 var(--f-mono);letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase}
.readout .big{font:500 30px/1.1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.readout .big sup{font-size:.55em}
.readout .sub{font:12px/1.5 var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.scalebar{margin-top:8px;align-self:flex-end;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.scalebar i{display:block;height:6px;border:1px solid var(--ink);border-top:0}
.scalebar b{font:500 12px/1 var(--f-mono)}

/* 讲解卡片 */
.card{position:absolute;left:max(186px,calc(env(safe-area-inset-left,0px) + 186px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:min(400px,calc(100vw - 420px));max-height:min(46vh,520px);display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden}
.card header{padding:14px 18px 8px;display:flex;flex-direction:column;gap:3px}
.card .eyebrow{display:flex;gap:10px;align-items:center;font:11px/1.3 var(--f-mono);letter-spacing:.14em;color:var(--ink-2);text-transform:uppercase}
.card .badge{border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--lamp);letter-spacing:.06em;text-transform:none;font-family:var(--f-body)}
.card .badge.spec{color:var(--spec);border-color:rgba(198,156,255,.4)}
.card h2{margin:0;font:700 24px/1.25 var(--f-display);letter-spacing:.06em;text-wrap:balance}
.card h2 small{font:400 13px/1 var(--f-mono);color:var(--ink-3);letter-spacing:.04em;margin-left:10px}
.card .lead{margin:6px 0 0;color:var(--ink);font-size:14px}
.tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 8px 7px;font-size:13px;color:var(--ink-2);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--lamp)}
.pane{touch-action:pan-y;overscroll-behavior:contain;padding:12px 18px 16px;overflow:auto;color:var(--ink-2);font-size:13.5px;line-height:1.8;min-height:0}
.pane p{margin:0 0 8px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0}
.facts dt{color:var(--ink-3)}
.facts dd{margin:0;color:var(--ink);font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 18px 12px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:8px;border-radius:2px;display:inline-block}
.card.min .tabs,.card.min .pane,.card.min .lead,.card.min .legend{display:none}
.card .fold{position:absolute;top:10px;right:10px;background:none;border:1px solid var(--line);border-radius:6px;width:26px;height:26px;cursor:pointer;color:var(--ink-2);line-height:1}

/* 场景控件 */
.ctrls{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:62px;display:flex;flex-direction:column;align-items:flex-end;gap:10px;max-width:min(360px,46vw)}
.ctrl{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.ctrl label{font:11px/1.2 var(--f-mono);letter-spacing:.12em;color:var(--ink-3)}
.seg{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px}
.seg button{background:var(--glass);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.seg button:hover{color:#fff}
.seg button[aria-pressed="true"]{color:var(--bg);background:var(--lamp);border-color:var(--lamp)}
.ctrl input[type=range]{width:200px;accent-color:var(--lamp);touch-action:pan-x}
.ctrl output{font:12px var(--f-mono);color:var(--ink)}
.meter{display:flex;flex-direction:column;gap:4px;align-items:flex-end;font:12px/1.4 var(--f-mono);color:var(--ink-2)}
.meter b{color:var(--ink);font-weight:500}

/* 字幕提示 */
.note{position:absolute;left:50%;top:18%;transform:translateX(-50%);max-width:min(560px,80vw);text-align:center;font:500 15px/1.6 var(--f-body);color:var(--ink);text-shadow:0 1px 12px rgba(0,0,0,.9);opacity:0;transition:opacity .8s;pointer-events:none}
.note.show{opacity:1}

/* 载入 */
.veil{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);transition:opacity 1.2s;z-index:5;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));text-align:center}
.veil h1{margin:0;font:900 clamp(34px,8vw,64px)/1.1 var(--f-display);letter-spacing:.24em}
.veil p{margin:0;color:var(--ink-2);max-width:34em}
.veil .bar{width:180px;height:1px;background:var(--line);overflow:hidden}
.veil .bar i{display:block;height:100%;width:0;background:var(--lamp);transition:width .3s}
.veil.gone{opacity:0;pointer-events:none}
.err{color:#ff9d8a}

@media (max-width:820px){
  .brand h1{font-size:20px}
  .brand p{display:none}
  .ruler{top:60px;bottom:auto;height:38vh;width:40px}
  .ruler .tick span,.ruler .stop{display:none}
  .ruler .desert{display:none}
  .card{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;bottom:max(12px,env(safe-area-inset-bottom,0px));max-height:44vh}
  .card h2{font-size:19px}
  .readout{bottom:auto;top:56px}
  .readout .big{font-size:20px}
  .readout .scalebar{display:none}
  .ctrls{top:auto;bottom:calc(44vh + 24px);max-width:calc(100vw - 80px)}
  .card.min ~ .ctrls{bottom:120px}
  .ctrl input[type=range]{width:150px}
  .note{top:30%;font-size:13.5px}
  .tools .btn{padding:5px 11px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){ .note,.veil{transition:none} }
</style>
</head>
<body>
<canvas id="gl" aria-label="三维微观场景，滚动缩放，拖拽旋转"></canvas>

<div class="hud">
  <div class="brand"><h1>微观之旅</h1><p>From a water drop to the Planck length</p></div>

  <div class="tools">
    <button class="btn" id="btnTour" aria-pressed="false" title="自动向内缩放（空格键）">漫游</button>
    <button class="btn" id="btnFull" title="全屏">全屏</button>
  </div>

  <nav class="ruler" id="ruler" aria-label="尺度标尺"></nav>

  <section class="card" id="card" aria-live="polite">
    <button class="fold" id="fold" aria-label="收起讲解">–</button>
    <header>
      <div class="eyebrow"><span id="cScale"></span><span class="badge" id="cBadge"></span></div>
      <h2 id="cTitle"></h2>
      <p class="lead" id="cLead"></p>
    </header>
    <div class="legend" id="cLegend"></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tObs" aria-selected="true" data-tab="observe">怎样看见</button>
      <button role="tab" id="tMet" aria-selected="false" data-tab="method">画面是什么</button>
      <button role="tab" id="tFac" aria-selected="false" data-tab="facts">数据</button>
    </div>
    <div class="pane" id="cPane"></div>
  </section>

  <div class="ctrls" id="ctrls"></div>

  <div class="readout" id="readout">
    <span class="lab">视野宽度</span>
    <span class="big" id="rBig"></span>
    <span class="sub" id="rSub"></span>
    <span class="sub" id="rE"></span>
    <div class="scalebar"><i id="sbBar"></i><b id="sbTxt"></b></div>
  </div>

  <div class="note" id="note"></div>
</div>

<div class="veil" id="veil">
  <h1>微观之旅</h1>
  <p>从荷叶上的一滴水出发，向内缩放三十多个数量级：硅藻的玻璃外壳、液态水的氢键网络、电子云、原子核、质子里的胶子场，直到量子真空与普朗克尺度。</p>
  <div class="bar"><i id="veilBar"></i></div>
  <p id="veilMsg" style="font-size:12px">正在编译着色器…</p>
</div>

<script src="js/gl.js"></script>
<script src="js/s0-droplet.js"></script>
<script src="js/s1-diatom.js"></script>
<script src="js/s2-water.js"></script>
<script src="js/s3-atom.js"></script>
<script src="js/s4-nucleus.js"></script>
<script src="js/s5-proton.js"></script>
<script src="js/s6-field.js"></script>
<script src="js/s7-planck.js"></script>
<script src="js/main.js"></script>
</body>
</html>
